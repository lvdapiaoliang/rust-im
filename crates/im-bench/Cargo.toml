[package]
name = "im-bench"
description = "压测工具：连接风暴、消息吞吐基准、用户态弱网模拟（延迟/丢包/乱序注入）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
im-protocol.workspace = true
im-transport.workspace = true
# 压测要驱动真实扇出引擎（GroupHub actor + Sessions::fanout_one），
# 会话核心是必依赖——成员表来源用内存实现（MemberSource），不连库
im-server.workspace = true
bytes.workspace = true
tokio.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "im-bench"
path = "src/main.rs"
