# 阶段 14：文档站部署（mdBook → GitHub Pages）。
#
# 触发：master 上 docs/、book.toml 或本文件有改动时（文档没动不重发，
# 省 runner 时间）；也支持手动触发（Actions 页面 Run workflow）。
# 预置条件（一次性人工步骤，workflow 无法代劳）：仓库 Settings → Pages →
# Build and deployment → Source 选「GitHub Actions」。首次创建 Pages 站点需
# admin 权限，而 GITHUB_TOKEN 最高只到 pages:write（configure-pages 的
# enablement:true 实机报 Resource not accessible by integration，无法自建）——
# 故必须先由仓库管理员手动开一次；开启后本 workflow 即可正常部署。
name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "book.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署：新的 push 取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 预编译二进制安装（比 cargo install 快几分钟，社区标准 action；
      # 名字是 actions-mdbook 复数——写成 action-mdbook 会报 repository not found）
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.40"
      - run: mdbook build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
